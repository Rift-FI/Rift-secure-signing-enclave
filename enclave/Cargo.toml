[package]
name = "rift-signer-enclave"
description = "Rift signing enclave — Nitro Enclaves binary that decrypts envelope-encrypted EOA private keys via KMS attestation and signs Safe UserOp hashes."
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true

[[bin]]
name = "rift-signer-enclave"
path = "src/main.rs"

[dependencies]
# Cross-platform deps from the workspace.
tokio.workspace = true
aes.workspace = true
cbc.workspace = true
cipher.workspace = true
k256.workspace = true
rsa.workspace = true
sha2.workspace = true
sha3.workspace = true
rand.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
ciborium.workspace = true
base64.workspace = true
hex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Linux-only — gated so `cargo check` works on Windows / Mac.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.5"
aws-nitro-enclaves-nsm-api = "0.4"

# OpenSSL for CMS EnvelopedData unwrapping (CiphertextForRecipient).
#
# KMS Decrypt with the Recipient parameter wraps the plaintext in a CMS
# EnvelopedData structure (RFC 5652), encoded in BER with indefinite-
# length sequences. The pure-Rust `cms` + `der` crates from RustCrypto
# strict-DER-decode and reject the indefinite-length form, which is
# exactly what KMS uses — so a pure-Rust path requires either pre-
# converting BER→DER manually (fragile) or a BER-aware parser (not
# widely available). The AWS Nitro Enclaves C SDK uses OpenSSL for this
# step; we do the same in Rust via openssl-rs.
#
# `vendored` builds OpenSSL statically into our enclave binary so there
# is no runtime libssl dependency and the enclave image stays self-
# contained. Build time goes up ~5-10 minutes; PCR0 surface includes
# the OpenSSL bits.
openssl = { version = "0.10", features = ["vendored"] }
