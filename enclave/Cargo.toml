[package]
name = "rift-signer-enclave"
description = "Rift signing enclave — Nitro Enclaves binary that decrypts envelope-encrypted EOA private keys via KMS attestation and signs Safe UserOp hashes."
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true

[[bin]]
name = "rift-signer-enclave"
path = "src/main.rs"

[dependencies]
# Cross-platform deps from the workspace.
tokio.workspace = true
aes.workspace = true
cbc.workspace = true
cipher.workspace = true
k256.workspace = true
rsa.workspace = true
sha2.workspace = true
sha3.workspace = true
rand.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
ciborium.workspace = true
base64.workspace = true
hex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Linux-only — gated so `cargo check` works on Windows / Mac.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.5"
aws-nitro-enclaves-nsm-api = "0.4"

# CMS / PKCS#7 EnvelopedData parsing for KMS CiphertextForRecipient.
# KMS Decrypt with the Recipient parameter wraps the plaintext-encrypted-
# to-the-attestation-public-key inside a CMS EnvelopedData structure (per
# RFC 5652) — the C SDK uses OpenSSL's CMS_decrypt for this. In Rust we
# parse the CMS with the pure-Rust `cms` crate, then do the RSA-OAEP +
# AES-CBC steps ourselves with the deps we already have.
cms = "0.2"
const-oid = "0.9"
der = "0.7"
