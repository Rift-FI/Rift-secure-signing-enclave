# Pin the toolchain so every build of this enclave produces the same
# PCR0 measurement. Any change here changes the binary, the EIF, and
# the KMS key policy condition. Treat updates here as you would treat
# a deployment cutover (build new EIF, add new PCR0 to key policy,
# cutover traffic, remove old PCR0).
#
# 1.92.0 chosen because aws-sdk-kms (and the rest of the aws-smithy
# stack we depend on for KMS Decrypt-with-Recipient) require Rust 1.91.1+
# as of late 2026. Bumping past minimum so a future patch release
# doesn't push the floor again.

[toolchain]
channel = "1.92.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
