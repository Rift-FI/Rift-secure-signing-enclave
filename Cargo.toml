# Cargo workspace for the Rift Nitro Enclave signing stack.
#
# Two crates:
#   - enclave        — the binary that runs INSIDE the Nitro Enclave.
#                      Tiny. No network. Just NSM + RSA + AES + secp256k1.
#                      This binary becomes the Docker image we feed to
#                      `nitro-cli build-enclave`.
#   - parent-proxy   — the binary that runs on the EC2 host (NOT in the
#                      enclave). Talks to the smart-wallet over HTTP on
#                      localhost:7777, talks to the enclave over vsock,
#                      talks to AWS KMS over the internet on the
#                      enclave's behalf (Decrypt-with-Recipient).
#
# Both share dependency versions via [workspace.dependencies] so we never
# accidentally have mismatched k256 / serde / etc. on either side.

[workspace]
resolver = "2"
members = ["enclave", "parent-proxy"]

[workspace.package]
edition = "2021"
license = "PROPRIETARY"
authors = ["Rift Finance"]
version = "0.1.0"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time"] }
# Crypto — same versions across both binaries so the AES/RSA wire format
# can't drift.
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["std"] }
cipher = "0.4"
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
# p256 is needed for ES256 OIDC tokens (Apple's id_tokens) and for the
# vast majority of WebAuthn assertions (COSE algorithm -7).
p256 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }
# Ed25519 for verifying Rift-signed per-project WebAuthn config
# bundles (see enclave/src/project_config.rs). ONLY the verifier
# side ships in the enclave — signing is done by the backend with
# the ed25519 private key held in Rift's own secret store.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
ciborium = "0.2"
base64 = "0.22"
hex = "0.4"
# Error + logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Reproducible release builds for stable PCR0.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
